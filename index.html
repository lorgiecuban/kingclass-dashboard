<title>KingClass Academy — Management Dashboard</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f8fafc;color:#1e293b;line-height:1.5}
.header{background:linear-gradient(135deg,#1B2A4A 0%,#2E5090 100%);color:#fff;padding:20px 32px}
.header h1{font-size:28px;font-weight:800;letter-spacing:-0.5px}
.header p{color:#93c5fd;margin-top:4px;font-size:14px}
.header-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
select.slicer{padding:8px 16px;border-radius:8px;font-size:16px;font-weight:700;background:#ED7D31;color:#fff;border:none;cursor:pointer;min-width:160px}
select.slicer option{color:#333;background:#fff}
.tabs{background:#fff;border-bottom:1px solid #e2e8f0;padding:0 32px;display:flex;gap:4px;overflow-x:auto}
.tab{padding:12px 20px;font-size:14px;font-weight:500;border-bottom:2px solid transparent;cursor:pointer;color:#64748b;white-space:nowrap;transition:all .15s}
.tab:hover{color:#334155}
.tab.active{color:#ea580c;border-bottom-color:#ea580c}
.content{padding:24px 32px;max-width:1440px;margin:0 auto}
.grid{display:grid;gap:16px}
.grid-5{grid-template-columns:repeat(5,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
@media(max-width:1200px){.grid-5,.grid-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){.grid-5,.grid-3,.grid-2{grid-template-columns:1fr}}
.kpi{border-radius:10px;padding:16px 20px;color:#fff}
.kpi-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;opacity:.85}
.kpi-value{font-size:26px;font-weight:800;margin-top:4px}
.kpi-sub{font-size:11px;opacity:.7;margin-top:2px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:16px;overflow:hidden}
.card h3{font-size:14px;font-weight:700;color:#1B2A4A;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead tr{background:#1B2A4A;color:#fff}
th{padding:8px 12px;text-align:left;font-weight:600;white-space:nowrap;cursor:pointer;user-select:none}
th.right,td.right{text-align:right}
td{padding:8px 12px;border-bottom:1px solid #f1f5f9}
tr:hover{background:#eff6ff}
tr.combined{background:#ecfdf5;font-weight:600}
tr.alt{background:#f8fafc}
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:99px;background:#bbf7d0;color:#166534;margin-left:8px;font-weight:600}
.pos{color:#16a34a;font-weight:700}
.neg{color:#dc2626;font-weight:700}
.muted{color:#94a3b8}
tfoot tr{background:#f1f5f9;font-weight:700;border-top:2px solid #334155}
.insights-header{background:#C00000;color:#fff;padding:12px 20px;border-radius:10px 10px 0 0;font-weight:700;font-size:16px}
.insight-row{padding:12px 20px;border-bottom:1px solid #f1f5f9;display:flex;align-items:flex-start;gap:10px;font-size:13px}
.insight-row.alert-row{background:#fef2f2}
.insight-row .icon{flex-shrink:0;margin-top:2px}
.upload-zone{border:2px dashed #93c5fd;border-radius:10px;padding:24px;background:#fff;text-align:center}
.upload-zone h3{font-size:16px;font-weight:700;margin-bottom:8px}
.upload-zone input[type=file]{margin-top:12px}
.code-block{background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:12px;font-family:monospace;font-size:12px;white-space:pre;overflow-x:auto}
.msg-box{background:#ecfdf5;border:1px solid #bbf7d0;border-radius:8px;padding:12px 16px;color:#166534;margin:16px 0}
.how-to-box{background:#f0f9ff;border:1px solid #bae6fd;border-radius:10px;padding:20px;margin-top:16px}
.mb-4{margin-bottom:16px}.mb-6{margin-bottom:24px}.mt-2{margin-top:8px}.mt-4{margin-top:16px}
.text-sm{font-size:13px}.text-xs{font-size:11px}.text-muted{color:#64748b}
.drill-back{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;background:#f1f5f9;border:1px solid #cbd5e1;cursor:pointer;font-size:14px;font-weight:600;color:#334155;margin-bottom:16px;transition:all .15s}
.drill-back:hover{background:#e2e8f0}
.clickable-row{cursor:pointer;transition:background .1s}
.clickable-row:hover{background:#eff6ff !important}
.drill-hint{font-size:11px;color:#94a3b8;font-weight:400;margin-left:8px}
#kc-auth{position:fixed;inset:0;background:linear-gradient(135deg,#1B2A4A 0%,#2E5090 100%);display:flex;align-items:center;justify-content:center;z-index:9999}
#kc-auth.hidden{display:none}
.kc-auth-box{background:#fff;border-radius:16px;padding:40px 48px;width:360px;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.35)}
.kc-auth-box h2{font-size:22px;font-weight:800;color:#1B2A4A;margin-bottom:4px}
.kc-auth-box p{font-size:13px;color:#64748b;margin-bottom:24px}
.kc-auth-box input{width:100%;padding:11px 14px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:15px;outline:none;margin-bottom:12px;transition:border .15s}
.kc-auth-box input:focus{border-color:#2E5090}
.kc-auth-box button{width:100%;padding:12px;background:linear-gradient(135deg,#1B2A4A,#2E5090);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer}
.kc-auth-box button:hover{opacity:.9}
.kc-auth-error{color:#dc2626;font-size:12px;margin-top:6px;min-height:16px}
</style>
</head>
<body>
<div id="kc-auth">
  <div class="kc-auth-box">
    <h2>KingClass Academy</h2>
    <p>Management Dashboard — Team Access</p>
    <input id="kc-pw" type="password" placeholder="Enter password" autocomplete="current-password"/>
    <button onclick="kcLogin()">Enter</button>
    <div class="kc-auth-error" id="kc-err"></div>
  </div>
</div>
<script>
(function(){
  var PW="KingClass2026";
  if(sessionStorage.getItem("kc_auth")==="1"){document.getElementById("kc-auth").classList.add("hidden");}
  document.getElementById("kc-pw").addEventListener("keydown",function(e){if(e.key==="Enter")kcLogin();});
  window.kcLogin=function(){
    var v=document.getElementById("kc-pw").value;
    if(v===PW){sessionStorage.setItem("kc_auth","1");document.getElementById("kc-auth").classList.add("hidden");}
    else{document.getElementById("kc-err").textContent="Incorrect password. Try again.";document.getElementById("kc-pw").value="";}
  };
})();
</script>

const {useState,useMemo,useCallback,createElement:h}=React;
const {BarChart,Bar,XAxis,YAxis,CartesianGrid,Tooltip,Legend,ResponsiveContainer,PieChart,Pie,Cell}=Recharts;

// ============================================================
// MAIN APP
// ============================================================
function App(){
  const[currData,setCurrData]=useState(()=>{try{var s=localStorage.getItem("kc_curr");return s?JSON.parse(s):INIT_CURR;}catch(e){return INIT_CURR;}});
  const[gradeData,setGradeData]=useState(()=>{try{var s=localStorage.getItem("kc_grade");return s?JSON.parse(s):INIT_GRADE;}catch(e){return INIT_GRADE;}});
  const[period,setPeriod]=useState("YTD");
  const[tab,setTab]=useState("dashboard");
  const[uploadMsg,setUploadMsg]=useState("");

  const months=useMemo(()=>{
    const m=[...new Set(currData.filter(d=>d.year===2026).map(d=>d.month))];
    return m.sort((a,b)=>MONTH_ORDER.indexOf(a)-MONTH_ORDER.indexOf(b));
  },[currData]);

  const filter=useCallback((data,year)=>{
    if(period==="YTD")return data.filter(d=>d.year===year);
    return data.filter(d=>d.year===year&&d.month===period);
  },[period]);

  const branchPerf=useMemo(()=>{
    const d26=filter(currData,2026),d25=filter(currData,2025);
    return LOCATIONS.map(loc=>{
      const codes=loc.branchCodes;
      const s26=d26.filter(d=>codes.includes(d.branchCode)).reduce((a,b)=>a+b.students,0);
      const r26=d26.filter(d=>codes.includes(d.branchCode)).reduce((a,b)=>a+b.revenue,0);
      const s25=d25.filter(d=>codes.includes(d.branchCode)).reduce((a,b)=>a+b.students,0);
      const r25=d25.filter(d=>codes.includes(d.branchCode)).reduce((a,b)=>a+b.revenue,0);
      return{...loc,s26,r26,s25,r25,yoyRev:r26-r25,yoyStud:s26-s25,yoyPct:r25?(r26-r25)/r25:0};
    });
  },[currData,filter]);

  const currPerf=useMemo(()=>{
    const d26=filter(currData,2026),d25=filter(currData,2025);
    const tot=d26.reduce((a,b)=>a+b.revenue,0);
    return CURRICULA.map(c=>{
      const r26=d26.filter(d=>d.curriculum===c).reduce((a,b)=>a+b.revenue,0);
      const r25=d25.filter(d=>d.curriculum===c).reduce((a,b)=>a+b.revenue,0);
      const s26=d26.filter(d=>d.curriculum===c).reduce((a,b)=>a+b.students,0);
      return{name:c,r26,r25,s26,yoy:r26-r25,yoyPct:r25?(r26-r25)/r25:0,share:tot?r26/tot:0};
    });
  },[currData,filter]);

  const gradePerf=useMemo(()=>{
    const d26=filter(gradeData,2026),d25=filter(gradeData,2025);
    const tot=d26.reduce((a,b)=>a+b.revenue,0);
    return GRADES.map(g=>{
      const r26=d26.filter(d=>d.grade===g).reduce((a,b)=>a+b.revenue,0);
      const r25=d25.filter(d=>d.grade===g).reduce((a,b)=>a+b.revenue,0);
      const s26=d26.filter(d=>d.grade===g).reduce((a,b)=>a+b.students,0);
      return{name:g,r26,r25,s26,yoy:r26-r25,yoyPct:r25?(r26-r25)/r25:0,share:tot?r26/tot:0};
    });
  },[gradeData,filter]);

  const kpis=useMemo(()=>{
    const tR26=branchPerf.reduce((a,b)=>a+b.r26,0);
    const tR25=branchPerf.reduce((a,b)=>a+b.r25,0);
    const tS26=branchPerf.reduce((a,b)=>a+b.s26,0);
    const zc=branchPerf.filter(b=>b.r26===0).length;
    return{tR26,tR25,yoy:tR26-tR25,yoyPct:tR25?(tR26-tR25)/tR25:0,tS26,zc,active:33-zc};
  },[branchPerf]);

  const topB=useMemo(()=>[...branchPerf].sort((a,b)=>b.yoyRev-a.yoyRev).slice(0,10),[branchPerf]);
  const botB=useMemo(()=>[...branchPerf].filter(b=>b.yoyRev<0).sort((a,b)=>a.yoyRev-b.yoyRev).slice(0,5),[branchPerf]);
  const currSort=useMemo(()=>[...currPerf].sort((a,b)=>b.yoy-a.yoy),[currPerf]);
  const gradeSort=useMemo(()=>[...gradePerf].sort((a,b)=>b.yoy-a.yoy),[gradePerf]);

  function handleReset(){
    try{localStorage.removeItem("kc_curr");localStorage.removeItem("kc_grade");}catch(e){}
    setCurrData(INIT_CURR);setGradeData(INIT_GRADE);setUploadMsg("Data reset to built-in defaults.");
  }

  function handleUpload(e,type){
    const file=e.target.files[0];if(!file)return;
    Papa.parse(file,{header:true,skipEmptyLines:true,complete:function(results){
      const rows=results.data;
      if(type==="curriculum"){
        const parsed=rows.map(r=>({month:r.Month||r.month,year:parseInt(r.Year||r.year),branchCode:r["Branch Code"]||r.branchCode||r.BranchCode,branchName:r["Branch Name"]||r.branchName||r.BranchName,curriculum:r.Curriculum||r.curriculum,students:parseInt(r.Students||r.students||0),revenue:parseFloat(r.Revenue||r.revenue||r["Revenue (฿)"]||0)})).filter(r=>r.month&&r.year&&r.branchCode);
        const newPeriods=[...new Set(parsed.map(r=>r.month+"|"+r.year))];
        setCurrData(prev=>{
          const kept=prev.filter(d=>!newPeriods.includes(d.month+"|"+d.year));
          const result=[...kept,...parsed];
          try{localStorage.setItem("kc_curr",JSON.stringify(result));}catch(e){}
          return result;
        });
        const replaced=newPeriods.length;
        const months=[...new Set(parsed.map(r=>r.month))].join(", ");
        setUploadMsg((replaced?" Replaced":"Added")+" "+parsed.length+" curriculum records ("+months+"). Overlapping periods auto-replaced.");
      }else{
        const parsed=rows.map(r=>({month:r.Month||r.month,year:parseInt(r.Year||r.year),branchCode:r["Branch Code"]||r.branchCode||r.BranchCode,branchName:r["Branch Name"]||r.branchName||r.BranchName,grade:r.Grade||r.grade,students:parseInt(r.Students||r.students||0),revenue:parseFloat(r.Revenue||r.revenue||r["Revenue (฿)"]||0)})).filter(r=>r.month&&r.year&&r.branchCode);
        const newPeriods=[...new Set(parsed.map(r=>r.month+"|"+r.year))];
        setGradeData(prev=>{
          const kept=prev.filter(d=>!newPeriods.includes(d.month+"|"+d.year));
          const result=[...kept,...parsed];
          try{localStorage.setItem("kc_grade",JSON.stringify(result));}catch(e){}
          return result;
        });
        const months=[...new Set(parsed.map(r=>r.month))].join(", ");
        setUploadMsg("Replaced "+parsed.length+" grade records ("+months+"). Overlapping periods auto-replaced.");
      }
    }});e.target.value="";
  }

  const insights=useMemo(()=>{
    const items=[];
    const dir=kpis.yoy>=0?"▲":"▼";
    items.push({type:kpis.yoy>=0?"positive":"negative",text:"OVERALL: Revenue "+fmtB(kpis.tR26)+" (2026) vs "+fmtB(kpis.tR25)+" (2025) → "+dir+" "+fmtB(Math.abs(kpis.yoy))+" YoY ("+fmtPct(kpis.yoyPct)+")"});
    if(kpis.zc>0)items.push({type:"alert",text:"ZERO-REVENUE: "+kpis.zc+" locations at ฿0. Immediate franchisee outreach needed — confirm status, set recovery targets."});
    const km=currPerf.find(c=>c.name==="KingMath");
    if(km)items.push({type:"info",text:"CURRICULUM: KingMath = "+fmtPct(km.share)+" of revenue (concentration risk). Accelerate CMS + KingScience cross-sell to diversify."});
    const dec=gradePerf.filter(g=>g.yoy<0).map(g=>g.name);
    if(dec.length)items.push({type:"warning",text:"GRADE PIPELINE: "+dec.join(", ")+" declining YoY. Upper-grade retention campaign needed."});
    return items;
  },[kpis,currPerf,gradePerf]);

  // RENDER
  return h("div",null,
    // Header
    h("div",{className:"header"},
      h("div",{className:"header-row"},
        h("div",null,h("h1",null,"KINGCLASS ACADEMY"),h("p",null,"Management Dashboard — 33 Locations (Combined View)")),
        h("div",{style:{display:"flex",alignItems:"center",gap:12}},
          h("span",{style:{color:"#93c5fd",fontSize:13}},"Period:"),
          h("select",{className:"slicer",value:period,onChange:e=>setPeriod(e.target.value)},
            h("option",{value:"YTD"},"YTD (All Months)"),
            months.map(m=>h("option",{key:m,value:m},m))
          )
        )
      )
    ),
    // Tabs
    h("div",{className:"tabs"},
      ["dashboard","branches","curriculum","grades","upload"].map(t=>
        h("div",{key:t,className:"tab"+(tab===t?" active":""),onClick:()=>setTab(t)},
          t==="dashboard"?"Dashboard":t==="branches"?"Branch Performance":t==="curriculum"?"Curriculum":t==="grades"?"Grade Level":"Upload Data"
        )
      )
    ),
    // Content
    h("div",{className:"content"},
      tab==="dashboard"&&renderDashboard(kpis,topB,botB,currSort,gradeSort,currPerf,insights,period),
      tab==="branches"&&h(renderBranches,{data:branchPerf,period:period}),
      tab==="curriculum"&&h(CurriculumTab,{data:currPerf,sorted:currSort,period:period,currData:currData,filter:filter}),
      tab==="grades"&&h(GradeTab,{data:gradePerf,sorted:gradeSort,period:period,gradeData:gradeData,filter:filter}),
      tab==="upload"&&renderUpload(handleUpload,handleReset,uploadMsg,currData,gradeData)
    )
  );
}

function renderBranches({data,period}){
  const[sortKey,setSortKey]=useState("yoyRev");
  const[sortDir,setSortDir]=useState("desc");
  const sorted=useMemo(()=>[...data].sort((a,b)=>sortDir==="desc"?b[sortKey]-a[sortKey]:a[sortKey]-b[sortKey]),[data,sortKey,sortDir]);
  function toggle(k){if(sortKey===k)setSortDir(d=>d==="desc"?"asc":"desc");else{setSortKey(k);setSortDir("desc");}}
  const arrow=k=>sortKey===k?(sortDir==="desc"?" ▼":" ▲"):"";
  const tot={s26:data.reduce((a,b)=>a+b.s26,0),r26:data.reduce((a,b)=>a+b.r26,0),s25:data.reduce((a,b)=>a+b.s25,0),r25:data.reduce((a,b)=>a+b.r25,0),yoy:data.reduce((a,b)=>a+b.yoyRev,0)};

  const gradePeriods=[...new Set(gradeData.map(d=>d.month+" "+d.year))].sort((a,b)=>{var ya=parseInt(a.split(" ")[1]),yb=parseInt(b.split(" ")[1]);if(ya!==yb)return ya-yb;return MONTH_ORDER.indexOf(a.split(" ")[0])-MONTH_ORDER.indexOf(b.split(" ")[0])});
